prometheus:
  image:
    repository: prom/prometheus
    tag: v2.54.1
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  scrapeInterval: 15s
  targets:
    demoApp: demo-app:80

nodeExporter:
  image:
    repository: prom/node-exporter
    tag: v1.8.2
    pullPolicy: IfNotPresent
  service:
    port: 9100

grafana:
  image:
    repository: grafana/grafana
    tag: 11.2.0
    pullPolicy: IfNotPresent
  adminUser: admin
  adminPassword: admin
  service:
    type: ClusterIP
    port: 3000

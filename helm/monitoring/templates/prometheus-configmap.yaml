apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.scrapeInterval }}

    scrape_configs:
      - job_name: demo-app
        metrics_path: /metrics
        static_configs:
          - targets:
              - {{ .Values.prometheus.targets.demoApp | quote }}

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: jenkins
        metrics_path: /prometheus
        static_configs:
          - targets:
              - {{ .Values.prometheus.targets.jenkins | quote }}

      - job_name: node-exporter
        static_configs:
          - targets:
              - "node-exporter:{{ .Values.nodeExporter.service.port }}"

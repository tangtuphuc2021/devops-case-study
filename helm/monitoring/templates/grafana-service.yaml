apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type }}
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
